# .github/workflows/build.yml
name: Build Android APK

# 触发条件：当有代码推送到 main 分支，或手动触发时运行[reference:8]
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # 使用 Ubuntu 环境[reference:9]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3[reference:10]

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug[reference:11]

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4[reference:12]
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk[reference:13]