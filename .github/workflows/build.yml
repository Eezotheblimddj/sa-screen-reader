name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      # Generate Gradle wrapper if it doesn't exist
      - name: Prepare Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "📦 Generating Gradle wrapper..."
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle wrapper
          else
            echo "✅ Gradle wrapper found"
          fi

      # DEBUG: Show project structure
      - name: Show project structure
        run: |
          echo "📁 Current directory:"
          pwd
          echo ""
          echo "📂 Files in root:"
          ls -la
          echo ""
          echo "📂 Looking for build.gradle files:"
          find . -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts"
          echo ""
          echo "📂 Checking for app folder:"
          ls -la app/ 2>/dev/null || echo "No 'app' folder found"

      # Build using the wrapper with more info
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          echo "🔨 Running build..."
          ./gradlew assembleDebug --stacktrace

      # Find and show APK location
      - name: Find APK location
        run: |
          echo "🔍 Searching for APK files..."
          find . -name "*.apk" -type f || echo "No APK found"
          echo ""
          echo "📂 Checking build output folders..."
          find . -type d -name "outputs" 2>/dev/null || echo "No outputs folder found"

      # Upload any APK found
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/*.apk
            app/**/*.apk
          if-no-files-found: error