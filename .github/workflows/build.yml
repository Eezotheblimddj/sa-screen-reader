name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      # This action will automatically install Gradle (no wrapper needed)
      - name: Build Debug APK
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug
          gradle-version: 8.4

      # DEBUG: Find where the APK actually is
      - name: Find APK location
        run: find app -name "*.apk" 2>/dev/null || find . -name "*.apk"

      # UPLOAD: Uses wildcard to catch any APK anywhere
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/**/*.apk
          if-no-files-found: error